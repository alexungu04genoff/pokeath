name: Canonical regression checks

on:
  push:
  pull_request:

jobs:
  canonical-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CAD dependencies
        run: pip install -r requirements-cad.txt
      - name: Run canonical regression checks
        run: python -m src.tools.run_regression_checks
